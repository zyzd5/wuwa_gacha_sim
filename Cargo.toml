[package]
name = "wuwa_gacha_sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "鸣潮「角色活动唤取」限定 5★ 角色抽卡模拟器"
publish = false

[lib]
name = "wuwa_gacha_sim"
path = "src/lib.rs"

[[bin]]
name = "wuwa_gacha_sim"
path = "src/main.rs"

# 精确锁版本：Cargo.lock 已提交，且这里的 `=` 保证不会因上游发布新版本而改变行为。
[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
rand = "=0.9.2"
rand_chacha = "=0.9.0"
